<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Clawdbot Linux Node</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Ubuntu, sans-serif; margin: 16px; }
      .row { margin: 6px 0; }
      code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; }
      .state { font-weight: 600; }
      .muted { color: #666; }
    </style>
  </head>
  <body>
    <h2>Clawdbot Linux Node</h2>

    <div class="row">Node ID: <code id="nodeId"></code></div>
    <div class="row">Gateway: <code id="gateway"></code></div>
    <div class="row muted" id="details"></div>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
